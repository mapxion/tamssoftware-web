server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; location / { try_files $uri $uri/ $uri/index.html =404; } location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; } gzip on; gzip_types text/plain text/css application/javascript application/json image/svg+xml; }
